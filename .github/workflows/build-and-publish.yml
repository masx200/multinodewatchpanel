name: Build And Publish (Git Hash Release)

on:
  push:
    # branches:
    #   - main
    #   - master
    #   - develop
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Git Short Hash
        id: hash
        run: echo "SHORT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Get Commit Message
        id: commit
        run: echo "MESSAGE=$(git log -1 --pretty=%B | head -n 1 | tr '[:space:]' '-' | tr -cd '[:alnum:]-_')" >> $GITHUB_OUTPUT

      - name: Generate Release Tag
        id: tag
        run: |
          # 从 git ref 提取 tag 版本号 (refs/tags/v1.0.0 -> v1.0.0)
          VERSION="${GITHUB_REF#refs/tags/}"
          # 如果不是 tag 触发，则使用 sha 前缀
          if [[ "$VERSION" == "$GITHUB_REF" ]]; then
            VERSION="sha-$(echo $GITHUB_SHA | cut -c1-7)"
          fi
          echo "TAG=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG_NAME=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.11.1"

      - name: Build Web
        run: |
          cd frontend &&npm i -g pnpm@10.30.3 &&pnpm config set ignore-scripts false&& pnpm install --force&& npm run build:pro
        env:
          PNPM_IGNORE_SCRIPTS: false
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: |
            core/go.sum
            agent/go.sum

      - name: Build Release
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --skip=publish --clean 
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete Existing Release (ignore error)
        run: |
          gh release delete ${{ steps.tag.outputs.TAG_NAME }} --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Assets to GitHub Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.TAG_NAME }}
          name: "Build ${{ steps.hash.outputs.SHORT_HASH }}"
          body: |
            ## Commit Info
            - **SHA**: ${{ github.sha }}
            - **Branch**: ${{ github.ref_name }}
            - **Message**: ${{ steps.commit.outputs.MESSAGE }}

            ## Changes
            Triggered by commit `${{ github.sha }}`
          draft: false
          prerelease: false
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          target_commitish: ${{ github.sha }}

  docker:
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Git Short Hash
        id: hash
        run: echo "SHORT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Get Commit Message
        id: commit
        run: echo "MESSAGE=$(git log -1 --pretty=%B | head -n 1 | tr '[:space:]' '-' | tr -cd '[:alnum:]-_')" >> $GITHUB_OUTPUT

      - name: Extract Tag Version
        id: tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          if [[ "$VERSION" == "$GITHUB_REF" ]]; then
            VERSION="sha-$(echo $GITHUB_SHA | cut -c1-7)"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            # git tag 版本: v1.0.0
            type=ref,event=tag
            # git short hash: sha-abc1234
            type=sha,prefix=sha-,format=short
            # branch name
            type=ref,event=branch
            # latest (仅 main/master)
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
          labels: |
            org.opencontainers.image.title=1Panel Multi-Node Watch
            org.opencontainers.image.description=Free multi-node monitoring panel based on 1Panel
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/ppc64le,linux/s390x,linux/riscv64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.tag.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print Docker Summary
        run: |
          echo "## Docker Image Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Git SHA** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Short Hash** | \`${{ steps.hash.outputs.SHORT_HASH }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version Tag** | \`${{ steps.tag.outputs.VERSION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | ${{ steps.commit.outputs.MESSAGE }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`${{ env.REGISTRY }}/${{ github.repository }}:${{ steps.tag.outputs.VERSION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Platforms** | linux/amd64, linux/arm64, linux/arm/v7, linux/ppc64le, linux/s390x, linux/riscv64 |" >> $GITHUB_STEP_SUMMARY
